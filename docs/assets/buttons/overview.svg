<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 76" width="248" height="76" role="img"
     aria-label="Overview Slides PDF">
  <title>Overview Slides</title>
  <defs>
    <linearGradient id="bo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.38"/><stop offset="45%" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="46%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="so" x1="0" y1="0" x2="1" y2="1">
