  <path d="M18 4.2 H230" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" fill="none"/>
  <rect x="3" y="3" width="242" height="66" rx="15" fill="none" stroke="#0f766e" stroke-opacity="0.8" stroke-width="1"/>
  <g transform="translate(26, 24)"><rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M12 17 v4 M7 21 h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M6.5 13 l3.5 -4 l3 2.5 l4 -5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="68" y="31" font-size="15" font-weight="700" fill="#fff" fill-opacity="0.80" letter-spacing="0.08em"
