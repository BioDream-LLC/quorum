    <rect x="3" y="3" width="242" height="66" fill="url(#gl)"/>
    <rect x="-64" y="3" width="150" height="66" fill="url(#sl)" transform="skewX(-18)"/>
  </g>
  <path d="M18 4.2 H230" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" fill="none"/>
  <rect x="3" y="3" width="242" height="66" rx="15" fill="none" stroke="#9a520a" stroke-opacity="0.8" stroke-width="1"/>
  <g transform="translate(26, 24)"><path d="M12 2 v13 M6.5 10 l5.5 5.5 l5.5 -5.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20 h18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
  <text x="68" y="31" font-size="15" font-weight="700" fill="#fff" fill-opacity="0.80" letter-spacing="0.08em"
