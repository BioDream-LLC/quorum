<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="38%" stop-color="#14b8a6"/>
      <stop offset="76%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.66"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="47%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1184" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <text id="word" x="96" y="250" font-size="132" font-weight="800" letter-spacing="-0.022em"
          font-family="Avenir Next, Avenir, Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">quorum</text>
    <clipPath id="letters"><use href="#word"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="1000" cy="200" rx="430" ry="330" fill="url(#halo)"/>

  <use href="#word" fill="url(#ink)"/>
  <g clip-path="url(#letters)"><rect x="0" y="0" width="1280" height="640" fill="url(#gleam)"/></g>

  <!-- The mark: three readings into a chip, one checked answer out. -->
  <g transform="translate(800 120) scale(0.9)">
    <g fill="#475569">
      <rect x="92" y="0" width="12" height="20" rx="3"/><rect x="128" y="0" width="12" height="20" rx="3"/>
      <rect x="164" y="0" width="12" height="20" rx="3"/>
      <rect x="92" y="176" width="12" height="20" rx="3"/><rect x="128" y="176" width="12" height="20" rx="3"/>
      <rect x="164" y="176" width="12" height="20" rx="3"/>
    </g>
    <rect x="70" y="18" width="128" height="160" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <g stroke="#a78bfa" stroke-width="7" stroke-linecap="round">
      <path d="M0 52 L112 98"/><path d="M0 98 H112"/><path d="M0 144 L112 98"/>
    </g>
    <circle cx="0" cy="52" r="12" fill="#38bdf8"/><circle cx="0" cy="98" r="12" fill="#fbbf24"/>
    <circle cx="0" cy="144" r="12" fill="#a78bfa"/>
    <circle cx="134" cy="98" r="32" fill="url(#ans)"/>
    <path d="M118 99 l11 11 l21 -23" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M168 98 H330" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="96" y="322" font-size="30" fill="#94a3b8" letter-spacing="0.2em"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">CHECKED RULES FOR SMALL MACHINES</text>

  <path d="M96 364 H1184" stroke="url(#rule)" stroke-width="2.5" fill="none"/>

  <text x="96" y="424" font-size="35" font-weight="600" fill="#f1f5f9"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">Plain-word rules, checked against every situation</text>

  <text x="96" y="474" font-size="27" fill="#cbd5e1"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">One clear answer, with its reasons, on a Raspberry Pi Pico 2 or an Arduino Uno R4.</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="96" y="512" width="330" height="74" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <text x="118" y="542" font-size="21" fill="#64748b">safety function</text>
    <text x="118" y="572" font-size="25" font-weight="700" fill="#4ade80">under 3 KB <tspan font-weight="400" fill="#64748b">of flash</tspan></text>

    <rect x="446" y="512" width="390" height="74" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <text x="468" y="542" font-size="21" fill="#64748b">pump rulebook</text>
    <text x="468" y="572" font-size="25" font-weight="700" fill="#4ade80">16,384 <tspan font-weight="400" fill="#64748b">situations checked</tspan></text>

    <rect x="856" y="512" width="328" height="74" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <text x="878" y="542" font-size="21" fill="#64748b">worst case</text>
    <text x="878" y="572" font-size="25" font-weight="700" fill="#4ade80">proven <tspan font-weight="400" fill="#64748b">before it runs</tspan></text>
  </g>

  <text x="1184" y="70" font-size="24" fill="#64748b" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">github.com/BioDream-LLC/quorum</text>
</svg>
